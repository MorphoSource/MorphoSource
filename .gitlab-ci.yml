.deploy:
  stage: deploy
  variables:
    K8S_STRATEGY: RollingUpdate
    K8S_RUN_DB_MIGRATE: false
  image:
    name: gitlab-registry.oit.duke.edu/duke_openshift_users/community-supported-resources/build-helper:alpine
  tags:
    - oit-shared

deploy_dev:
  extends: .deploy
  only:
    refs:
      - dev
  before_script:
    - if [ "$MIGRATE_DB" == "true" ]; then K8S_STRATEGY="Recreate"; fi
    - if [ "$MIGRATE_DB" == "true" ]; then K8S_RUN_DB_MIGRATE="true"; fi
    - oc login $K8S_URL_DEV --token=$K8S_TOKEN_DEV
    - oc project $K8S_NAMESPACE_DEV
  script:
    - mkdir helm_chart
    - cd helm_chart/
    - git clone https://$GITLAB_CI_REPO_READ_USER:$GITLAB_CI_REPO_READ_TOKEN@gitlab.oit.duke.edu/morphosource/helm-chart.git .
    - helm upgrade morphosource charts/hyrax -f charts/hyrax/values.yaml -f charts/hyrax/values.dev.yaml --set image.tagPrefix=app-dev- --set worker.image.tagPrefix=worker-dev- --set workerBatch.image.tagPrefix=worker-dev- --set workerHeavy.image.tagPrefix=worker-dev- --set image.tagVersion=$CI_COMMIT_SHORT_SHA --set strategyType=$K8S_STRATEGY --set runDbMigrate=$K8S_RUN_DB_MIGRATE

deploy_prod:
  extends: .deploy
  only:
    refs:
      - main
  before_script:
    - if [ "$MIGRATE_DB" == "true" ]; then K8S_STRATEGY="Recreate"; fi
    - if [ "$MIGRATE_DB" == "true" ]; then K8S_RUN_DB_MIGRATE="true"; fi
    - oc login $K8S_URL_PROD --token=$K8S_TOKEN_PROD
    - oc project $K8S_NAMESPACE_PROD
  script:
    - mkdir helm_chart
    - cd helm_chart/
    - git clone https://$GITLAB_CI_REPO_READ_USER:$GITLAB_CI_REPO_READ_TOKEN@gitlab.oit.duke.edu/morphosource/helm-chart.git .
    - helm upgrade morphosource charts/hyrax -f charts/hyrax/values.yaml -f charts/hyrax/values.prod.yaml --set image.tagPrefix=app-main- --set worker.image.tagPrefix=worker-main- --set workerBatch.image.tagPrefix=worker-main- --set workerHeavy.image.tagPrefix=worker-main- --set image.tagVersion=$CI_COMMIT_SHORT_SHA --set strategyType=$K8S_STRATEGY --set runDbMigrate=$K8S_RUN_DB_MIGRATE
