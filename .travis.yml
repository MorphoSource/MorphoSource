# Based on https://github.com/duke-libraries/rdr/blob/develop/.travis.yml

language: ruby
cache:
  bundler: true
  directories:
  - downloads
rvm:
  - 2.4.2
services:
  - postgresql
  # Use redis for background jobs
  - redis-server
addons:
  firefox: '61.0'
before_install:
  # from http://www.columbia.edu/~njn2118/journal/2016/10/28.html
  - wget https://github.com/mozilla/geckodriver/releases/download/v0.21.0/geckodriver-v0.21.0-linux64.tar.gz
  - mkdir geckodriver
  - tar -xzf geckodriver-v0.21.0-linux64.tar.gz -C geckodriver
  - export PATH=$PATH:$PWD/geckodriver

  # begin installing Alembic python dependencies --------
  #- sudo apt-get install python-pip
  - sudo apt-get update
  - sudo apt-get install python3-pip
  - pip3 -V
  - sudo pip3 install numpy
  - python3 -c 'import numpy; print(numpy.__version__)'
  - sudo pip3 install Pillow
  - python3 -c 'import PIL; print(PIL.__version__)'
  - sudo pip3 install pydicom
  - python3 -c 'import pydicom; print(pydicom.__version__)'
  - export MORPHOSOURCE_PYTHON="python3"
  # end installing Alembic python dependencies --------

script: "bundle exec rake ci:wrapped_spec[~accessibility]"
jdk:
  - oraclejdk8
dist: trusty
