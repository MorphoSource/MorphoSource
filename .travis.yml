# Based on https://github.com/duke-libraries/rdr/blob/develop/.travis.yml

language: ruby
cache:
  bundler: true
  directories:
  - downloads
rvm:
  - 2.4.2
services:
  - postgresql
  # Use redis for background jobs
  - redis-server
addons:
  firefox: '61.0'
before_install:
  # from http://www.columbia.edu/~njn2118/journal/2016/10/28.html
  - wget https://github.com/mozilla/geckodriver/releases/download/v0.21.0/geckodriver-v0.21.0-linux64.tar.gz
  - mkdir geckodriver
  - tar -xzf geckodriver-v0.21.0-linux64.tar.gz -C geckodriver
  - export PATH=$PATH:$PWD/geckodriver

  # begin installing Alembic python dependencies --------
  - sudo apt-get install python-pip
  - sudo pip install numpy
  - python -c 'import numpy; print(numpy.__version__)'
  - sudo pip install Pillow
  - python -c 'import PIL; print(PIL.__version__)'
  - sudo pip install pydicom
  - python -c 'import pydicom; print(pydicom.__version__)'
  - export MORPHOSOURCE_PYTHON="python"
  # end installing Alembic python dependencies --------



  # begin Blender setup --------
  - cd $TRAVIS_BUILD_DIR/download
  - mkdir -p $TRAVIS_BUILD_DIR/downloads
  - wget -nc -O $TRAVIS_BUILD_DIR/downloads/blender-2.82-linux64.tar.xz https://download.blender.org/release/Blender2.82/blender-2.82-linux64.tar.xz || echo "File already exists"
  - unxz blender-2.82-linux64.tar.xz
  - tar xjf blender-2.82-linux64.tar
  - mv blender-2.82-linux64.tar blender
  - export PATH=$PATH:$TRAVIS_BUILD_DIR/download/blender
  - blender -v


