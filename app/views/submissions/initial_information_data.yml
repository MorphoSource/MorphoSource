examples:
  Image:
    Photography:
      raw: 
        - Image produced by camera with no filters or processing applied
      derived:
        - Image with filter or processing applied (dimension reduction, contrast enhancement, etc.)
  Video:
    Video:
      raw:
        - Initial video with no filters or processing applied
      derived:
        - Video with filter or processing applied
  CTImageSeries:
    MicroNanoXRayComputedTomography:
      raw:
        - Projection data produced by scanner software
      derived:
        - Reconstruction data
        - Projection data with subsequent processing
    MagneticResonanceImaging:
      raw:
        - Projection data produced by scanner software
      derived:
        - Reconstruction data
        - Projection data with subsequent processing
    SynchrotronImaging:
      raw:
        - X-ray projection images produced by scanner software
      derived:
        - Reconstructed image slices
        - X-ray projection images with subsequent processing
  PhotogrammetryImageSeries:
    Photogrammetry:
      raw:
        - Initial images produced by camera with no filters or processing applied
      derived:
        - Camera images with any type of processing (masking, etc.)
  Mesh:
    StructuredLight:
      raw:
        - Data produced by scanner software with no additional processing applied
      derived:
        - Mesh or point cloud with subsequent processing (merging, denoising, simplification, etc.)
    LaserScan:
      raw:
        - Data produced by scanner software with no additional processing applied
      derived:
        - Mesh or point cloud with subsequent processing (merging, denoising, simplification, etc.)