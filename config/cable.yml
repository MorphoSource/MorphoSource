development:
  adapter: redis
  url: redis://<%= ENV['REDIS_HOST'] || 'localhost' %>:6379

test:
  adapter: async

production:
  adapter: redis
  url: <%= ENV['REDIS_URL'] || "redis://:#{ ENV["REDIS_PASSWORD"] || "" }@#{ ENV["REDIS_HOST"] || "localhost" }:6379/" %>
  channel_prefix: MorphoSource_SF_production
