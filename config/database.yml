# SQLite version 3.x
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem 'sqlite3'
#
default: &default
  adapter: postgresql
  encoding: UTF8
  pool: 5
  username: <%= ENV['DB_USERNAME'] || 'hydra' %>
  password: <%= ENV['DB_PASSWORD'] || 'hydra' %>

development:
  <<: *default
  database: <%= ENV['DB_NAME'] || 'development' %>
  url: <%= "postgresql://#{ ENV['DB_HOST'] || 'localhost' }/" %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: test
  url: <%= "postgresql://#{ ENV['DB_HOST'] || 'localhost' }/" %>

production:
  adapter: postgresql
  encoding: UTF8
  database: <%= ENV['MORPHOSOURCE_DB_NAME'] || ENV['DB_NAME'] %>
  pool: 5
  username: <%= ENV['MORPHOSOURCE_DB_USER'] || ENV['DB_USERNAME'] %>
  password: <%= ENV['MORPHOSOURCE_DB_PASS'] || ENV['DB_PASSWORD'] %>
  url: <%= "postgresql://#{ ENV['DB_HOST'] || 'localhost' }/" %>
  