en:
  morphosource:
    docs:
      contributors:
        title: "Information for Contributors"
        text: "Please email the MorphoSource administrators (<a href='mailto:morphosource@duke.org'>morphosource@duke.org</a>) to request contributor status.  Make sure to register an account on MorphoSource and include the email address associated with your MorphoSource account before contacting us.  Please also provide your academic affiliation as well as the source and nature of data you plan to contribute.  Estimates of the data volume are important to provide as well."
