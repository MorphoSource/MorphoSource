  hyrax:
    browse:
      page_description:
        projects:
          "A project is a themed assortment of media and specimens. Projects can be used to share media ownership and access between project members, and projects can also be used to publish assortments of media and specimens for access and discovery by the public. Examples of projects could include the 3D data used in a single research paper or a collections digitization project. If you want to share media ownership and access with multiple users across multiple projects, consider creating a user team. Projects can be managed by teams, and users with access to that team also gain access to any projects managed by that team."
        teams:
          "Teams are groups of MorphoSource users that can share media ownership and access between team members. Teams can also contain projects, and media for team projects can be viewed both at the project and team levels. The chief difference between teams and projects is that projects provide a group of users with access to a single assortment of media and specimens, like a single individual research paper or one collections project. Teams provide a group of users with access to multiple themed assortments of media and specimens, like a lab group with multiple research paper projects. Additionally, if you are an official representative of an organization represented in MorphoSource, your team can be linked to that organization, which enables some level of access control over media representing specimens from that organization. Contact the MorphoSource admins to discuss this further. "
