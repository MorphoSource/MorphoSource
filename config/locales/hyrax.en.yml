          managers: 
            title: 'Managers'
            help: Managers of this collection can add to and remove works from the collection, modify collection metadata, and delete the collection. For collections of type Project, when works are created directly in this collection, the managers are given edit access to the new work.
            empty: No managers have been added.
          editors: 
            title: 'Editors'
            help: Depositors of this collection can view the collection and add works to it, even if the visibility permissions of the collection otherwise would not permit them to view it.
            empty: No editors have been added.
          depositors:
            title: 'Depositors'
            help: ' '
            empty: No depositors have been added.
          viewers: 
            title: 'Viewers'
            help: Viewers of this collection can view it even if the visibility permissions of the collection otherwise would not permit them to view it. For collections of type Project, when works are created directly in this collection, the viewers are given read access to the new work.
