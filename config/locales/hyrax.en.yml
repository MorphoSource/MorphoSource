      page_description:
        categories:
          header:
            "MorphoSource is a repository for media (3D and 2D) that represent physical objects. There are many ways to browse media and physical objects in the repository. It is also possible to search the repository using the search bar above, and to explore the data holdings using category facets associated with search results."
        organizations:
          "Organizations represent institutions, departments, collections, facilities, labs, and other groups that manage, house, and curate physical objects or imaging devices. An organization describes whatever bureaucratic entity is responsible for setting policies for access to physical objects or devices. Typically, organizations are collections or departments within an institution, but in some cases they can also be an entire larger institution or a specific smaller lab within a collection or department. A user team can be linked to an organization, enabling some level of access control over physical objects housed in that organization. Please contact the MorphoSource admins to discuss linking your user team to an organization."
        physical_object_types:
          "Media represent physical objects. Physical objects are divided into two categories, described below."
        biological_specimen_objects:
          "Biological specimens include skeletons, whole or partial bodies, fossils, fossil trackways, and other related objects that in some way preserve an element of or representation of a living creature."
        cultural_heritage_objects:
          "These include any object that is a physical artifact of some group, society, or culture."
        media_types_and_modalities:
          "Media are 3D and 2D representations of physical objects. In MorphoSource, media are principally sorted by two factors: media type and modality, as described below."
        media_types:
          "This is the broad type category that describes the media file or files."
        Mesh:
          "A 3D model or collection of 3D XYZ coordinate points. File types include PLY, STL, OBJ, X3D, GLB, GLTF, BIN, and WRL. This also includes ZIP files for mesh files with associated material and texture files, such as a combination of OBJ, MTL, and PNG files."
        CTImageSeries:
          "A collection of 2D image files that together comprise a CT/micro-CT volumetric stack. Files are ZIP archives with collections of images of file types DCM, TIFF, PNG, JPEG, or BMP. "
        PhotogrammetryImageSeries:
          "A collection of 2D image files that together comprise a photogrammetry image set. Files are ZIP archives with collections of images of file types TIFF, PNG, JPEG, or BMP. "
        Image:
          "A single 2D image file. File types include DCM, TIFF, PNG, JPEG, BMP, GIF, DNG, NEF, CRW, CR2, CR3, IIQ, ARW, RAW, and RW2."
        Video:
          "A single 2D video file. File types include WMV, MOV, AVI, MPEG, and M4V."
        Other:
          ""
        modalities:
          "This describes the method used to image a physical object in order to create media."
