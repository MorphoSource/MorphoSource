  simple_form:
    hints:
      collection:
        based_near: A place name related to the collection, such as its site of publication, or the city, state, or country the collection contents are about.
      defaults:
        agreement_uri: Additional terms and conditions that users must agree to in order to download media.
        data_manager: The user who should control most or all media representing organization objects. They will receive requests to transfer ownership of newly published or submitted media from original contributors to data manager. Contact admins to change.
        download_permission: Media publication status. Can be private, published with open download (any user can download), or published with restricted download (users must request to download).
        download_reviewer: MorphoSource user(s) who will receive download requests for restricted download media. If no reviewers are listed, the data manager will receive requests. If reviewers are listed, ONLY those users will receive requests.
        permissions_enforcement_mode: Whether organization default permission values are recommended or required to be used by new media contributors.
        preview_mode: "Whether media should be previewed with an interactive 3D/2D preview or restricted to a small 2D thumbnail. Interactive/Embeddable is generally recommended."
        morphosource_use_agreement_type: "The type of usage agreement that users must agree to in order to download media. Other conditions and agreements may be specified above and beyond this."
        permits_3d_use: "Whether 3D printing of media is permitted, prohibited, or limited. If 3D printing is limited, see documentation for more detail."
        permits_commercial_use: "Whether media may be used for commercial purposes or not."
        required_archival_of_published_derivatives: "Whether published derivatives created from media must be reuploaded to MorphoSource or elsewhere."
        rights_holder: Holder of intellectual property rights (either copyright or license-based) for the digital object.
        rights_statement: Standardized rights statements that can be used to communicate the copyright and re-use status of digital objects.
    labels:
      defaults:
        find_parent_work: Add to work
        description: Description
    placeholders:
      defaults:
        find_parent_work: Search...
  user:
    inactive_message: Your user account has been made inactive. This may be because you requested that your account be removed from active status, the original person associated with this account has left their field or is deceased, or you have been banned from MorphoSource due to not complying with the site terms of use. You may contact the MorphoSource admins (morphosource@duke.edu) to discuss this and potentially have your account returned to active status.
