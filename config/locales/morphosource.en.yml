en:
  morphosource:
    homepage:
      about_html: 'Welcome to MorphoSource 2.0, alpha! We hope you enjoy the new look and functionality.  Please be patient as this version is only meant to showcase specimen record pages, media file pages, and new improved 3D previews with measurement and annotation support. Even this home page is just a place holder. Only a small subset of the media available on MorphoSource 1.0 is currently available here and the only way to explore it is by visiting the collections page. That is, search and browse utilities are not yet available. Finally, file uploading and editing is not yet enabled. We look forward to your feedback on the features we have implemented so far! We are aiming for a more fully featured beta version by October 2019.'
      share_button: 'Share Your Work'
      my_works_button: 'My Works'
      banner_text_1: 'Find, view, and download 3D data representing the world''s natural history, cultural heritage, and scientific collections.'
      banner_text_2: 'Data are contributed by museums, researchers, and scholars to share findings, increase impact, and improve access to material critical for scientific discovery and the advancement of human knowledge.'
      launch_text: 'Welcome to the launch of MorphoSource 2.0! We are very excited to share the new and much improved version of the repository with you. You may find many differences compared to the previous version of MorphoSource. We have produced a <a href="http://bit.ly/ms2_launch_video" target="_blank" class="inline-button">launch welcome video <i class="fas fa-external-link-alt fa-sm"></i></a> to briefly cover major aspects of the new site, and a <a href="https://youtu.be/SDGcNLqDTDA" target="_blank" class="inline-button">3D viewer video <i class="fas fa-external-link-alt fa-sm"></i></a> to overview features and functions of the 3D viewer.  It is also possible that you may encounter bugs. We are working hard to address any issues, and you can help us by <a href="mailto:morphosource@duke.edu" class="inline-button">reporting bugs <i class="fa fa-envelope fa-sm"></i></a> that you encounter.'
      meshsource_text: 'MorphoSource has approximately 27,000 published 3D models of biological specimens (largely skeletal material). You can view all of these in your browser with no required software. Around 13,000 of these can be freely downloaded for further visualization and measurement. The remaining 14,000 can usually be downloaded after a simple request process. We have an easily sortable Google Spreadsheet listing all of these web-viewable models parsed by element, species, and more. Find it here:'
