    dashboard:
      landing_page:
        title: 'MorphoSource Dashboard'
        full_text:
          become_a_contributor: In order to upload media, participate in projects and teams, or act as data manager for media that are shared with or transferred to you, you must first request contributor status. Visit <a href="/contribute">Become A Contributor</a> and supply a few details about the media you intend to contribute to MorphoSource or your reason for applying to be a project member or data manager. An administrator will check your application, and you will either be approved or hear back with additional questions or instructions presently. Thank you!
        hints:
          new_media: You can add media to an existing project or team during the Media Details step of submission. Alternately, go to the project or team page and submit your media from there.
          my_projects: All projects you created or are a member of are listed here.
          my_teams: All teams you created or are a member of are listed here.
          my_sequential_section_lists: All sequential section lists you created or are a member of are listed here.
          my_media_and_objects: You can see all the media you have view, download, or edit access to here. You can also see all physical objects associated with those media.
          my_media_cart: If you have previously added media to your cart, they are listed here. You can download some or all of those media together at once. You can also start a download request for one or more restricted media you have previously added to your media cart.
          my_pending_requests: If you have previously requested to download restricted media, you can view the status of those requests here.
          requests_manager: If you have published media with restricted download and other users have requested access, those requests are here. You can approve, deny, or clear requests.
      my:
        background_jobs:
          page_title: Background Jobs
          page_description: MorphoSource processes many records using background jobs. As a contributor, knowing the status of background jobs associated with your media can help you diagnose minor issues relating to media creation. This is a new feature, and for now the only background job tracked here is batch media submission. There are many others types of background jobs that our system uses, and we will add new types for you to track here soon.
        contributor_petitions:
          header: 'Become A Contributor'
          reason: 'Describe the nature and purpose of the data you intend to contribute, or your reason for applying for project member and/or data manager status'
          user_affiliation: 'Organization (Institution, museum, university, etc.)'
          user_department: 'Department'
          user_advisor: 'If you are a graduate student, provide the name, email, and professional affiliation of your advisor (Required only for graduate students)'
          contribution_amount: 'Approximate size of the total data amount you intend to contribute in gigabytes or other appropriate units'
          terms_agree: 'Contributor terms and conditions'
          terms_agree_description: 'I agree to the MorphoSource <a href="/contributor_terms" target="_blank">Contributor Terms of Use</a>. I understand these are distinct from the general MorphoSource <a href="/terms" target="_blank">Terms of Use</a>, and I agree to comply with both sets of terms.'
        fund_codes:
          header: 'Fund Codes'
        heading:
