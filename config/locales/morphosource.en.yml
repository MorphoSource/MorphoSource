          date_downloaded: 'Date Downloaded'
          date_approved: 'Date Approved'
          date_canceled: 'Date Canceled'
          date_cleared: 'Date Cleared'
          date_denied: 'Date Denied'
          date_expired: 'Date Expired'
          date_requested: 'Date Requested'
          publication_status: 'Publication Status'
        previous_requests:
          table:
            date_decided: Decided
            download_reviewer: Decider
            requesting_user: Requester
            status: Status
          page_title: "Previous Requests"
          page_description: "This page lists requests to download your media that have already been decided. You can edit expiration dates for approved or expired requests."
        works:
          submission_button: 'New Submission'
      profiles:
        login_form_instructions: 'MorphoSource is improving user profiles! This will allow users to better identify themselves and their reasons for using or downloading data. It will also improve the ability of data contributors to demonstrate impact and reuse of data uploaded to MorphoSource. Before continuing, please select a user profile type that best describes you, and fill out any new required user information.'
        register_form_instructions: 'To use MorphoSource, you must create a user account profile. This user profile helps identify you and your reasons for using or downloading data. The information you include may be provided to data contributors when you download data so that those contributors can demonstrate impact and reuse of data they contribute to MorphoSource. Select the type of user profile that best describes you, as you may be required to provide different user information based on the profile type.'
        edit_form_instructions: 'On this page you can update your user account profile. This user profile helps identify you and your reasons for using or downloading data. The information you include may be provided to data contributors when you download data so that those contributors can demonstrate impact and reuse of data they contribute to MorphoSource. If you change the user profile type, you may be required to fill out new required user information based on the profile type.'
        edit_primary:
          address: "Address"
          affiliation: "Organization"
          change_picture: '<i class="fa fa-portrait"></i> Profile picture'
          country: "Country"
          delete_picture: "Delete picture"
          delete_picture_data_content: "If you would like to remove your picture entirely, check the box and save your profile."
