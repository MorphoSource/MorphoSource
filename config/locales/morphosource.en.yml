        generate_new_api_key: "Generate a new user-specific API key. Your previous key will no longer be functional."
        api_key_explanation: "Your API key is below. This key can be used to authenticate API requests as yourself, granting access to your private media and other records, among other user-specific abilities and powers. Generally speaking, you should not share this key with other individuals or allow it to be publicly accessible, as this will allow other individuals to access MorphoSource and your data as if they were you. You should treat this key as sensitive information and guard it like a password. If your key somehow becomes a compromised, you can invalidate the current key and generate a new one."
