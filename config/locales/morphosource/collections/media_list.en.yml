en:
  simple_form:
    labels:
      media_list:
        doi: DOI
    hints:
      media_list:
        based_near: A place name related to the collection, such as its site of publication, or the city, state, or country the collection contents are about.
        contributor: A person you want to recognize for playing a role in the creation of the list, but not the primary role.
        creator: The person or group responsible for creating the list.
        description: Free-text notes about the collection. Examples include abstracts of a paper or citation information for a journal article.
        keyword: Words or phrases you select to describe what the collection is about. These are used to search for content.
        title: A name to aid in identifying a collection.
        doi: To request a DOI, please send an email to morphosource@duke.edu. Note that once a DOI has been assigned, the list media and metadata can no longer be edited. List managers will still be able to add and remove other users as list managers in order to access metadata and usage statistics for the list.
  morphosource:
    collections:
      media_list:
        exports:
          media:
            media_export:
              label: Media metadata with facets CSV
              filename: 'Object%20Media%20Metadata'
            media_download_counts:
              label: Media metadata with download counts CSV
              filename: 'Object%20Media%20Download%20Counts'
            media_downloads:
              label: Individual media downloads CSV
              filename: 'Object%20Media%20Downloads'
            media_requests:
              label: Individual media download requests CSV
              filename: 'Object%20Media%20Requests'