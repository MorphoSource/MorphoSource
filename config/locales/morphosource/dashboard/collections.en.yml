en:
  morphosource:
    dashboard:
      collections:
        form:
          non_contributor_errors: "The %{user} (%{emails}) can't be added to the %{access} role because they do not have contributor status. Either add the %{user} to a membership role that does not require contributor status (%{roles}) or have the %{user} request contributor status."
        form_branding:
          logo:
            description: An image to be displayed next to the %{collection_type} name and in search results. For best results, upload an image (JPG, GIF or PNG) that is 40 pixels in height. Larger images will be resized to 40 pixels in height.
          banner:
            description: An image to be displayed at the top of the %{collection_type} page. For best results, upload an image (JPG, GIF or PNG) that is at least 120 pixels tall and 1200 pixels wide.
        form_members_table:
          managers:
            title: 'Managers'
            help: Managers of this collection can add and remove works from the collection, modify collection metadata, give other members access, and delete the collection.
            empty: No managers have been added.
          viewers:
            title: 'Viewers'
            help: Viewers of this collection can view the collection even if it is private. Viewers are not given additional access to media in the collection.
            empty: No viewers have been added.
        new:
          header: New %{type_title}
        edit:
          header: Edit %{type_title}
        organization:
          info: For more information on organizational teams, please read <a href="https://duke.atlassian.net/wiki/spaces/MD/pages/35422980/What+is+an+Organizational+Management+Team">What is an Organizational Management Team?</a>
        permissions:
          info: Use these fields to specify default recommended permissions settings for newly contributed media. For more details on these fields and how they should be used, consult our documentation on <a href="https://duke.atlassian.net/wiki/spaces/MD/pages/35422501/Media+Ownership+Management+and+Reuse+Permissions" target="_blank">Media Ownership, Management, and Reuse Permissions</a>.
        media_lists:
          action:
            new:
              header: New Media List
            edit:
              header: Edit Media List
          new:
            header: New Media List
          edit:
            header: Edit Media List
          sequential_section_lists:
            new:
              header: New Sequential Section List
            edit:
              header: Edit Sequential Section List
          form_members_table:
            managers:
              title: 'Managers'
              help: Managers of this collection can add and remove media from the collection, modify collection metadata, grant other members access, and delete the collection.
              empty: No managers have been added.
            viewers:
              title: 'Viewers'
              help: Viewers of this collection can view the collection even if it is private. Viewers are not given additional access to media in the collection.
              empty: No viewers have been added.
        organization_collections:
          new:
            header: New Organization
          edit:
            header: Edit Organization
          form_members_table:
            managers:
              title: 'Managers'
              help: Managers of this organization can modify collection metadata, grant other members access, and add and edit organization devices. Managers have edit access to all media managed by the organization and view access to media representing organization objects or imaged using an organization device.
              empty: No managers have been added.
            editors:
              title: 'Editors'
              help: Editors are given edit and download access to all media managed by the organization and view access to media representing organization objects or imaged using an organization device. Editors can also add and edit organization devices.
              empty: No editors have been added.
            depositors:
              title: 'Depositors'
              help: Depositors can upload media to be managed by the organization, but are not granted additional access to media associated with the organization.
              empty: No depositors have been added.
            downloaders:
              title: 'Downloaders'
              help: Downloaders are given view access to all media associated with the organization through organization objects or devices and can download media managed by the organization.
              empty: No downloaders have been added.
            viewers:
              title: 'Viewers'
              help: Viewers are given view access to all media associated with the organization through organization objects or devices.
              empty: No viewers have been added.
        projects:
          new:
            header: New Project
          edit:
            header: Edit Project
        sequential_section_lists:
          new:
            header: New Sequential Section List
          edit:
            header: Edit Sequential Section List
        teams:
          new:
            header: New Team
          edit:
            header: Edit Team
          projects:
            header: Projects


