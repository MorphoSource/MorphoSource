en:
  morphosource:
    glossary:
      media_types_and_modalities: Media types include 3D meshes, 3D volumes, 2D images, and videos. Media modalities include CT/MRI, photogrammetry, laser scans, and others.
      physical_object_types: Physical objects associated with media are separated into two categories - biological specimen objects and cultural heritage objects.
      taxonomies: Biological specimens can be associated with taxonomic names, which include both binomial species names and higher-order classifications like family or phylum.
      projects: Media are grouped by projects created by users. Projects tend to contain media tied together by a theme. A project might represent the dataset for a single peer-reviewed paper, the results of a collections digitization project, or data for a digital lesson plan.
      project_uses: Projects can be used to share media ownership and access between project members, and projects can also be used to publish assortments of media and specimens for access and discovery by the public. If you want to share media ownership and access with multiple users across multiple projects, consider creating a user team. Projects can be managed by teams, and users with access to that team also gain access to any projects managed by that team.
      teams: Teams are groups of users that share media ownership and access across multiple projects and/or media. A team can manage one or more projects. A team can also contain media in a similar way to projects. A team might represent a lab group with multiple research paper projects or the staff of a museum collection uploading digital data representing their specimens.
      team_uses: The chief difference between teams and projects is that projects provide a group of users with access to a single assortment of media and specimens, while teams provide access to both media and one or more individual projects. Media in team projects can be viewed both at the project and team levels. Teams provide a group of users with access to multiple themed assortments of media and specimens. Additionally, if you are an official representative of an organization represented in MorphoSource, your team can be linked to that organization, which enables some level of access control over media representing specimens from that organization. Contact the MorphoSource admins to discuss this further.
      organizations: Organizations are museum collections, university laboratories, departments, facilities, or other groups that house and manage physical objects or imaging devices. Some organizations are officially linked to MorphoSource user teams, where the individuals responsible for a given organization have created a team to manage that organization on MorphoSource.


