      idigbio_search_results: 'Biological Specimens in iDigBio'
      idigbio_empty_search_results: 'No Biological Specimens found in IDigBio that match the search criteria.'
      morphosource_search_results: 'Physical Objects in MorphoSource'
      morphosource_empty_search_results: 'No Biological Specimens found in MorphoSource that match the search criteria.'
      po_empty_search_results: 'No physical objects found in MorphoSource or any appropriate external aggregators that match the search criteria. Search again or create a new physical object.'
      morphosource_result_from_idigbio: '(imported from IDigBio)'
      cant_find_organization: If you can't find the correct organization record using the search tools above, or if your physical object is not managed by a collection, department, lab, or other group, please contact the <a href="mailto:morphosource@duke.edu">MorphoSource administrators</a>. An administrator will create a new organization record for you or help you associate your object with no organization. Thank you!
      organization_data_management1: <b><span class="organization-name">Organization name</span></b> mandates that contributed media should be managed by the organization's selected data manager, <a class="organization-data-manager" href="#" target="_blank">User Display Name</a>, either on initial submission or when media is published in the future. Later in this process, you will be able to select whether to request to transfer management on submission or publication. The selected data manager is not required to manage this media. They may opt to allow you, the data depositor, to remain as the data manager. If they approve the transfer, the media will also be added to the organization's team.
      organization_data_management2: If you think your media should not be managed by the organization or if you would like to discuss the timing of any management transfer now or in the future when the media is published, please contact <a class="organization-data-manager" href="#" target="_blank">User Display Name</a>. To proceed with media submission, you must indicate you understand and agree with this policy.
      organization_data_management_for_collection1: <a class="organization-data-manager" href="#" target="_blank">Organization name</a> mandates that contributed media should be managed by the organization, either on initial submission or when media is published in the future. Later in this process, you will be able to select whether to request to transfer management on submission or publication. The organization is not required to manage this media. They may opt to allow you, the data depositor, to remain as the data manager.
      organization_data_management_for_collection2: If you think your media should not be managed by the organization or if you would like to discuss the timing of any management transfer now or in the future when the media is published, please contact the listed representatives for <a class="organization-data-manager" href="#" target="_blank">Organization name</a>. To proceed with media submission, you must indicate you understand and agree with this policy.
      organization_data_manager_submission_header: Organization Media Will Be Managed By Organization
      organization_data_manager_submission: You are a manager for <b><span class="organization-name">Organization name</span></b> or you are uploading on their behalf, and the media you are uploading represents a physical object from that organization. By default, this media will be managed by <span class="organization-name">Organization name</span></b></a>. You can change this during the Media Details step of submission.
      header_text:
        initial_information: 'We need to collect some initial information about your media.'
        parent_media: 'Got it. Since your media is derived, we need to ask about the parent media it derived from. If the parent is in MorphoSource, search for the parent''s media ID number. If not, indicate that. But if you have parent media available, please upload it first.'
        object_type: 'Please select the type of object this media represents.'
        bso_search: 'Thanks for that. Now we need to learn more about the physical object your media represents. If the object is already on MorphoSource or the iDigBio specimen aggregator, this will be easy - just search for your specimen and select it. Otherwise, create a new biological object record.'
        cho_search: 'Thanks for that. Now we need to learn more about the physical object your media represents. If the object is already on MorphoSource, this will be easy - just search for your specimen and select it. Otherwise, create a new cultural heritage object record.'
        po_organization: 'Is this physical object managed by a collection, department, lab, or other group? We call these organizations. If the object is managed by an organization, please search for the organization and select it.'
        po_taxonomy: 'If this biological specimen has been associated with a taxonomy, you can indicate that here. Specimens can be linked to one or more taxonomies. First, search for the taxonomy of your specimen. If a GBIF taxonomy is available, select that. Otherwise, select or create a more specific MorphoSource taxonomy. If you select or create a MorphoSource taxonomy, consider also associating your specimen with a GBIF-available higher term (order, family, etc.) that applies. This will allow your specimen to be discoverable in our taxonomic browse tree.'
        po_details: 'You''re almost done creating a physical object record. After providing this information, we will move on to media record creation. Please note the required and recommended fields.'
        media_device: 'Done with physical object, and on to media! We will first ask you about the device used to image this media. Is this device managed by a department, facility, collection, or other organization? If so, search for that organization below. If the device is a personal scanner, personal camera, and/or is not managed by a department, facility, collection, or other organization, select No Organization. Then select from the device list.'
        media_capture: 'Now we need to collect information about the initial parameters used to image these media. These fields will vary based on imaging modality.'
        media_processing: 'Since your media has been derived from some other parent media, it is possible to provide details about what processing was used to create this media. You can enter these details here.'
        media_details: 'This is the last step, you''re almost done. First, upload your media. Then provide us with some final details about the media. You can also control publication settings and access to the media here.'
      body_text:
        device_no_organization: 'If your device is a personal scanner, camera, and/or is not managed by a department, facility, collection, or other organization, enter "No Organization" and select the first result.'
      sidebar:
        raw_derived: "Raw/Derived"
        search_or_create: "Search/Create Object"
        upload_details: "Upload/Details"

