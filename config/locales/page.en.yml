en:
  page:
    new:
      button: "New Simple Page"
    delete:
      button: "Delete"
      confirm: "Are you sure you want to delete this page? This action cannot be undone."
  simple_form:
    labels:
      page:
        slug: URL slug
    hints:
      page:
        content: The formatted content of the page.
        slug: The URL identifier and path used to access the page. If you enter a title, this will be automatically generated. If you enter a custom URL, it will be used instead. Custom slugs should be unique, lower case, and contain only letters, numbers, and dashes. Slugs are appended to /pages. For example, if you enter 'my-page-2023', it will be accessible at /pages/my-page-2023.
        title: The title of the page.
        visibility: Whether the page is visible to the public or not.
    placeholders:
      page:
        slug: Add a title or enter custom URL slug