# Simple yaml config-driven schema which is used to define model attributes,
# index key names, and form properties.
#
# Attributes must have a type but all other configuration options are optional.
# Please note: If using Valkyrie's Fedora Metadata Adapter, predicates for attributes
# must be placed here.
#
# attributes:
#   attribute_name:
#     type: string
#     multiple: false
#     index_keys:
#       - "attribute_name_sim"
#     form:
#       required: true
#       primary: true
#       multiple: false
#
# @see config/metadata/basic_metadata.yaml for an example configuration
#
# Generated via
#  `rails generate hyrax:work_resource DeviceResource`
---
attributes:
  modality:
    type: string
    multiple: true
    form:
      required: true
      primary: true
      multiple: true
    index_keys:
      - "modality_tesim"
      - "modality_ssim"
    predicate: https://www.morphosource.org/terms/modality3D
  organization_id:
    type: string
    multiple: true
    form:
      required: false
      primary: false
      multiple: true
    index_keys:
      - "organization_id_tesim"
      - "organization_id_ssim"
    predicate: https://www.morphosource.org/terms/organizationID
  ark:
    type: string
    multiple: true
    form:
      required: false
      primary: false
      multiple: true
    index_keys:
      - "ark_tesim"
    predicate: https://www.morphosource.org/terms/ark