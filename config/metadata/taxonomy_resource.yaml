# Simple yaml config-driven schema which is used to define model attributes,
# index key names, and form properties.
#
# Attributes must have a type but all other configuration options are optional.
# Please note: If using Valkyrie's Fedora Metadata Adapter, predicates for attributes
# must be placed here.
#
# attributes:
#   attribute_name:
#     type: string
#     multiple: false
#     index_keys:
#       - "attribute_name_sim"
#     form:
#       required: true
#       primary: true
#       multiple: false
#
# @see config/metadata/basic_metadata.yaml for an example configuration
#
# Generated via
#  `rails generate hyrax:work_resource TaxonomyResource`

---
attributes:
  taxonomy_domain:
    type: string
    multiple: true
    index_keys:
     - "taxonomy_domain_tesim"
     - "taxonomy_domain_sim"
    form:
      required: false
      primary: true
      multiple: true
    predicate: https://www.morphosource.org/terms/domain
  taxonomy_kingdom:
    type: string
    multiple: true
    index_keys:
     - "taxonomy_kingdom_tesim"
