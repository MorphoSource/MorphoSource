  faculty_k12: 
    label: "Faculty or Staff (K-12)"
    required_metadata_fields: academic_institution_or_school, department, academic_field
    metadata_fields: academic_subfield
  educator_other:
    label: "Educator (Other)"
    required_metadata_fields: academic_institution_or_school, academic_field, mentor_or_advisor
    metadata_fields: department, academic_subfield
  student_postgrad:
    label: "Student (Post-Graduate)"
    required_metadata_fields: academic_institution_or_school, department, academic_field, mentor_or_advisor
    metadata_fields: academic_subfield
  student_undergrad: 
    label: "Student (Undergraduate)"
    required_metadata_fields: academic_institution_or_school, academic_field
