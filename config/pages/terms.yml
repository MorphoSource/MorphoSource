        1.  Copyright Complaints: We respect the intellectual property rights of others. If you believe your copyright has been violated on the Site, please contact us via this [link](https://security.duke.edu/copyrightdmca).
        2.  Other Site Issues: Please direct all other communications to <morphosource@duke.edu>.
      13. Applicable Law and Jurisdiction: The Site is controlled and operated from our facilities in and around Durham, North Carolina. These Terms of Use, and any claim or dispute that arises from or relates to your use of the Site or the Content, will be governed and construed with the laws of the State of North Carolina, without regard to principles relating to conflicts of laws principles. All such claims or disputes will be heard and resolved exclusively in the courts of the State of North Carolina, Durham or the United States District Court for the Central District of North Carolina. You consent to the jurisdiction of those courts, including, but not limited to, the *in personam* jurisdiction of those courts, and waive any objection to such jurisdiction on the grounds of venue or *forum non conveniens*, or the absence of *in personam* jurisdiction.
      14. Termination: The permissions granted to you will terminate automatically upon any breach by you of these Terms of Use. If we take down or otherwise cease to make a work available as an item of Content, the permission granted to you hereunder to use that Content thereafter will terminate at that time. MorphoSource is maintained as a scholarly and educational resource by Duke which may be modified or terminated by Duke in its sole discretion.
      15. Long term management: The sustainability of MorphoSource and the value of its Content for society, science, and its user community hinges on the Content held in this repository being kept as accessible as possibleover the long term. To help promote sustainability and value to society, science and end-user communities, you agree that Duke University, acting through its staff or authorized agents may take the following actions to make sure that the Content remains accessible.
          1.  **General.** By depositing your Content, you agree to give MorphoSource the non-exclusive right to disseminate and preserve the content. Preservation may require reproducing the content in different formats to ensure future accessibility. You also agree that (i) it is your responsibility to maintain an active Contributor account, be responsive to communications and system notifications from MorphoSource users, administrators, and staff, and keep your contact details in MorphoSource up to date; (ii) that failure to do so could result in MorphoSource taking any action referenced in this policy, MorphoSource transferring the management of your Content to MorphoSource or a third party (which could result in changes to access settings for you and others), or deleting your Content. If we take any action pursuant to this policy or the Terms of Use, you hereby and forever waive any right to assert a claim against Duke for any relief, damages,or liability, and you hereby agree to indemnify Duke for any liability pursuant to the terms of the Terms of Use. We will endeavor to make reasonable efforts to contact you before making changes referenced in this policy.
          2.  **Published Content.** If you have published Content with restricted download and you fail to manage access requests from Site users or fail to respond to communication attempts from us over a reasonable period of time (which, initially will be four months, but which you agree we may change when it updates this policy), then we, at our sole discretion, may take any of the following steps: 1. Communicate with users associated with your Content in order to discuss or resolve access issues. 2. Communicate with representatives at the organization managing the physical specimen (the 'organization') represented by Content. Possible solutions include, but are not limited to having the organization contact(s) either a) manage the Content; b) provide updated contact information for the missing contributor; or c) relinquish management of the Content to us. 3. If no organizational contact is available, we may contact your employer listed on your MorphoSource profile, and provide your employer the same opportunities as described for the specimen organization above. 4. If contacting the organization or employer is not possible or unsuccessful, we reserve the right to take over management of the Content for as long as necessary, and you agree not to contest our management in any way whatsoever.
          3.  **Unpublished Content.** If you have unpublished Content that no user has accessed for more than one year, we may ask you either to remove the Content, fund its continued storage, or publish the Content. If we are unable to contact you or others listed as editors of the Content through contact information obtained from user profiles on MorphoSource, then we have the right to remove the Content. This may initiate a review of other Content associated with your account.
          4.  **Inactive Contributor Account.** We reserve the right to take any action described in this policy or the Terms of Use if the Contributor status of your account becomes inactive.

