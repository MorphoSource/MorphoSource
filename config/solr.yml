# This is a sample config file that points to a solr server for each environment
development:
  url: <%= ENV['SOLR_DEVELOPMENT_URL'] || ENV['SOLR_URL'] || "http://127.0.0.1:#{ENV.fetch('SOLR_DEVELOPMENT_PORT', 8983)}/solr/hyrax" %>
test:
  url: <%= ENV['SOLR_TEST_URL'] || ENV['SOLR_URL'] || "http://127.0.0.1:#{ENV.fetch('SOLR_TEST_PORT', 8985)}/solr/hyrax_test" %>
production:
  url: <%= ENV['SOLR_URL'] || ( "http://#{ ENV['SOLR_HOST'] || "127.0.0.1" }:#{ ENV['SOLR_PORT'] || 8983 }/solr/#{ ENV['SOLR_COLLECTION_NAME'] || "hyrax" }" ) %>
