# mod_qos
# QS_LogOnly on
# QS_SrvMaxConnPerIP 7

<VirtualHost *:8081>
ServerName ${HOST_NAME}:8081
UseCanonicalName On
SSLEngine Off
RewriteEngine On
RewriteOptions Inherit

Timeout 3600
ProxyTimeout 3600
ProxyBadHeader Ignore

# SSLCertificateFile .pem
# SSLCertificateChainFile .pem
# SSLCertificateKeyFile .key

AllowEncodedSlashes NoDecode

DocumentRoot /app/samvera/hyrax-webapp/public
<Directory /app/samvera/hyrax-webapp/public>
  Options FollowSymLinks
  Require all granted
</Directory>

<Directory /app/samvera/hyrax-webapp/public/assets>
  RewriteEngine On

  <Files ~ "\.(css|js)$">
    RewriteCond %{HTTP:Accept-Encoding} \b(x-)?gzip\b
    RewriteCond %{REQUEST_FILENAME}.gz -s
    RewriteRule ^(.+)$ $1.gz
  </Files>

  <Files "*.css.gz">
    ForceType text/css
    Header set Content-Encoding gzip
    Header add Vary Accept-Encoding
  </Files>

  <Files "*.js.gz">
    ForceType application/javascript
    Header set Content-Encoding gzip
    Header add Vary Accept-Encoding
  </Files>
</Directory>

# Branding path
Alias /branding /app/samvera/hyrax-webapp/public/branding
<Directory /app/samvera/hyrax-webapp/public/branding>
  Require all granted
</Directory>

ProxyPass /Shibboleth.sso !
ProxyPass /assets !
ProxyPass /branding !
ProxyPass /favicon.ico !
ProxyPass /robots.txt !
ProxyPass /404.html !
ProxyPass /422.html !
ProxyPass /500.html !

# ActionCable - WebSocket proxy
ProxyPass /notifications/endpoint ws://app:3000/notifications/endpoint

# Fcrepo proxy
ProxyPass /fcrepo http://${FCREPO_HOST}:${FCREPO_PORT}/fcrepo
ProxyPassReverse /fcrepo http://${FCREPO_HOST}:${FCREPO_PORT}/fcrepo
<Proxy "http://${FCREPO_HOST}:${FCREPO_PORT}/fcrepo/*">
  # https://duldev.atlassian.net/browse/MR-473
  # RequestHeader set Authorization "Basic ZmVkb3JhQWRtaW46V1hySlZwaFVHcUJJUmxac0VndEVtVWsz"
  # <RequireAny>
  #   <RequireAll>
  #     Require local
  #   </RequireAll>
  # </RequireAny>
</Proxy>

# Solr proxy
ProxyPass /solr http://${SOLR_HOST}:${SOLR_PORT}/solr
ProxyPassReverse /solr http://${SOLR_HOST}:${SOLR_PORT}/solr
<Proxy "http://${SOLR_HOST}:${SOLR_PORT}/solr/*">
</Proxy>

# Rails-Puma proxy
ProxyPass / http://app:3000/ nocanon
ProxyPassReverse / http://app:3000/
<Proxy "http://app:3000/*">
  # N.B. https://github.com/rails/rails/issues/22965
  # RequestHeader set X-Forwarded-Proto "https"
</Proxy>

</VirtualHost>