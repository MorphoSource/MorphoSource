# mod_qos
# QS_LogOnly on
# QS_SrvMaxConnPerIP 7

# (1/4) Uncomment this block if using SSL certs
# <VirtualHost *:80>
#   RewriteEngine On
#   RewriteCond %{HTTPS} off
#   RewriteRule (.*) https://%{HTTP_HOST}%{REQUEST_URI}
# </VirtualHost>

# (2/4) Change :80 values here to :443 if using SSL certs
<VirtualHost *:80>
  ServerName ${HOST_NAME}:80
  UseCanonicalName On

  # (3/4) Uncomment these 3 lines if using SSL certs (must provide SSL certs via docker-compose-apache.yml)
  # SSLEngine On
  # SSLCertificateFile "/certs/server.crt"
  # SSLCertificateKeyFile "/certs/server.key"

  Timeout 3600
  ProxyTimeout 3600
  ProxyBadHeader Ignore

  AllowEncodedSlashes NoDecode

  # ActionCable - WebSocket proxy
  ProxyPass /notifications/endpoint ws://app:3000/notifications/endpoint

  # Fcrepo proxy
  ProxyPass /fcrepo http://${FCREPO_HOST}:${FCREPO_PORT}/fcrepo
  ProxyPreserveHost On
  <Proxy "http://${FCREPO_HOST}:${FCREPO_PORT}/fcrepo/*">
  </Proxy>

  # Solr proxy
  ProxyPass /solr http://${SOLR_HOST}:${SOLR_PORT}/solr
  ProxyPassReverse /solr http://${SOLR_HOST}:${SOLR_PORT}/solr
  <Proxy "http://${SOLR_HOST}:${SOLR_PORT}/solr/*">
  </Proxy>

  # Rails-Puma proxy
  ProxyPass / http://app:3000/ nocanon
  ProxyPassReverse / http://app:3000/
  <Proxy "http://app:3000/*">
    # N.B. https://github.com/rails/rails/issues/22965
    # (4/4) Uncomment this line if using SSL certs
    # RequestHeader set X-Forwarded-Proto "https"
  </Proxy>
</VirtualHost>